version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /apps/tauri/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "05:05"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/tauri
    schedule:
      interval: weekly
      day: monday
      time: "05:07"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
