name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Match the production image so syntax and dependency behavior do
          # not diverge between verification and deployment.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q app.py sdb_dartboard

      - name: Check browser JavaScript
        run: |
          node --check web/static/app.js
          node --check web/static/i18n.js
          node --check web/static/runtime-client.js
          node --check apps/tauri/ui/main.js
          node --check website/app.js

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build GitHub Pages site
        run: bash website/build.sh

      - name: Verify generated website assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/app.js
          test "$(find web/static/assets/modes -maxdepth 1 -name '*.webp' | wc -l)" \
            -eq "$(find dist/assets/modes -maxdepth 1 -name '*.webp' | wc -l)"
          test "$(find web/static/assets/themes/neon/modes -maxdepth 1 -name '*.webp' | wc -l)" \
            -eq "$(find dist/assets/neon -maxdepth 1 -name '*.webp' | wc -l)"

  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  apple-native:
    name: macOS and iOS native builds
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/tauri/src-tauri -> target

      - name: Install native build prerequisites
        run: brew install cocoapods libimobiledevice xcodegen

      - name: Install Tauri dependencies
        run: npm --prefix apps/tauri ci

      - name: Check shared core for Apple targets
        run: |
          cargo check --workspace --target aarch64-apple-ios
          cargo check --workspace --target aarch64-apple-ios-sim

      - name: Check native shell
        run: cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build macOS shell
        run: npm --prefix apps/tauri run build

      - name: Build unsigned iOS simulator app
        run: npm --prefix apps/tauri run tauri ios build -- --debug --target aarch64-sim --no-sign --ci

  container:
    name: Container build and smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: smart-dartboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          container_name="smart-dartboard-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --env SDB_ENABLE_BLE=0 \
            --env SDB_ALLOW_TEST_EVENTS=1 \
            --env SDB_DATA_DIR=/tmp/smart-dartboard-ci \
            --publish 127.0.0.1:18080:8000 \
            smart-dartboard:ci

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          python -c 'import json; state=json.load(open("/tmp/health.json")); assert state["status"] == "ok", state'
          curl --fail --silent --show-error http://127.0.0.1:18080/control >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/projector >/dev/null

  rust-container-preview:
    name: Rust container preview
    needs: rust-core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Rust preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rust
          load: true
          push: false
          tags: smart-dartboard:rust-preview-ci
          cache-from: type=gha,scope=rust-preview
          cache-to: type=gha,mode=max,scope=rust-preview

      - name: Smoke-test recovery and container isolation
        shell: bash
        run: |
          set -euo pipefail
          container_name="smart-dartboard-rust-${GITHUB_RUN_ID}"
          volume_name="smart-dartboard-rust-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            docker volume rm "$volume_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume_name" >/dev/null
          docker run --detach \
            --name "$container_name" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "source=$volume_name,target=/data" \
            --publish 127.0.0.1:18081:8000 \
            smart-dartboard:rust-preview-ci

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18081/api/v2/health > /tmp/rust-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          python - <<'PY'
          import json
          health = json.load(open('/tmp/rust-health.json'))
          assert health['status'] == 'ok', health
          assert health['schema_version'] == 2, health
          assert health['database'] == 'ok', health
          assert health['board'] == 'disabled', health
          PY
          test "$(docker inspect "$container_name" --format '{{.Config.User}}')" = dartboard
          test "$(docker inspect "$container_name" --format '{{.HostConfig.Privileged}}')" = false
          python - <<'PY'
          import json
          import urllib.request
          base = 'http://127.0.0.1:18081'
          bootstrap = json.load(urllib.request.urlopen(base + '/api/v2/runtime/bootstrap'))
          command = {
              'protocol_version': 1,
              'command_id': 'ci-start',
              'runtime_instance_id': bootstrap['runtime_instance_id'],
              'expected_revision': 0,
              'command': {
                  'type': 'start_game',
                  'game_type': 'x01',
                  'player_ids': ['ci-player'],
                  'options': {'start_score': 301, 'out_rule': 'double'},
              },
          }
          request = urllib.request.Request(
              base + '/api/v2/runtime/commands',
              data=json.dumps(command).encode(),
              headers={'content-type': 'application/json'},
          )
          result = json.load(urllib.request.urlopen(request))
          assert result['revision'] == 1, result
          open('/tmp/rust-instance-before', 'w').write(bootstrap['runtime_instance_id'])
          PY
          docker restart "$container_name" >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18081/api/v2/runtime/bootstrap > /tmp/rust-recovered.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          recovered = json.load(open('/tmp/rust-recovered.json'))
          previous_instance = open('/tmp/rust-instance-before').read()
          assert recovered['revision'] == 1, recovered
          assert recovered['payload']['game']['game_type'] == 'x01', recovered
          assert recovered['runtime_instance_id'] != previous_instance, recovered
          PY
