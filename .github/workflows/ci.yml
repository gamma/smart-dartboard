name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q app.py sdb_dartboard

      - name: Check browser JavaScript
        run: |
          node --check web/static/app.js
          node --check website/app.js

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build GitHub Pages site
        run: bash website/build.sh

      - name: Verify generated website assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/app.js
          test "$(find web/static/assets/modes -maxdepth 1 -name '*.webp' | wc -l)" \
            -eq "$(find dist/assets/modes -maxdepth 1 -name '*.webp' | wc -l)"
          test "$(find web/static/assets/themes/neon/modes -maxdepth 1 -name '*.webp' | wc -l)" \
            -eq "$(find dist/assets/neon -maxdepth 1 -name '*.webp' | wc -l)"

  container:
    name: Container build and smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: smart-dartboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          container_name="smart-dartboard-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --env SDB_ENABLE_BLE=0 \
            --env SDB_ALLOW_TEST_EVENTS=1 \
            --env SDB_DATA_DIR=/tmp/smart-dartboard-ci \
            --publish 127.0.0.1:18080:8000 \
            smart-dartboard:ci

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          python -c 'import json; state=json.load(open("/tmp/health.json")); assert state["status"] == "ok", state'
          curl --fail --silent --show-error http://127.0.0.1:18080/control >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/projector >/dev/null
