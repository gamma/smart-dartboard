name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Match the production image so syntax and dependency behavior do
          # not diverge between verification and deployment.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q app.py sdb_dartboard

      - name: Check browser JavaScript
        run: |
          node --check web/static/app.js
          node --check web/static/i18n.js
          node --check web/static/runtime-client.js
          node --check web/static/runtime-experience-client.js
          node --check web/static/native-entry.js
          node --check web/static/native-shell.js
          node --check apps/tauri/scripts/test-rust-ui.mjs
          node --check website/app.js

      - name: Verify pinned platform matrix
        run: node scripts/verify-platform-matrix.mjs

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build GitHub Pages site
        run: bash website/build.sh

      - name: Verify generated website assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/app.js
          test "$(find web/static/assets/modes -maxdepth 1 -name '*.webp' | wc -l)" \
            -eq "$(find dist/assets/modes -maxdepth 1 -name '*.webp' | wc -l)"
          test "$(find web/static/assets/themes/neon/modes -maxdepth 1 -name '*.webp' | wc -l)" \
            -eq "$(find dist/assets/neon -maxdepth 1 -name '*.webp' | wc -l)"

  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  apple-native:
    name: macOS and iOS native builds
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/tauri/src-tauri -> target

      - name: Install native build prerequisites
        run: brew install cocoapods libimobiledevice xcodegen

      - name: Verify Xcode baseline
        run: xcodebuild -version | grep -F 'Xcode 26.6'

      - name: Install Tauri dependencies
        run: npm --prefix apps/tauri ci

      - name: Install browser test engines
        run: npm --prefix apps/tauri exec -- playwright install chromium webkit

      - name: Check shared core for Apple targets
        run: |
          cargo check --workspace --target aarch64-apple-ios
          cargo check --workspace --target aarch64-apple-ios-sim
          cargo check --manifest-path apps/tauri/src-tauri/Cargo.toml --target x86_64-apple-ios

      - name: Check native shell
        run: |
          cargo fmt --manifest-path apps/tauri/src-tauri/Cargo.toml -- --check
          cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml
          cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Exercise browser contracts and Rust Runtime UI
        run: |
          npm --prefix apps/tauri run test:chromium
          npm --prefix apps/tauri run test:webkit
          npm --prefix apps/tauri run test:rust-ui
          npm --prefix apps/tauri run test:rust-modes

      - name: Build unsigned macOS app bundle
        run: npm --prefix apps/tauri run build:macos:app

      - name: Archive unsigned macOS app bundle
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "apps/tauri/src-tauri/target/release/bundle/macos/Smart Dartboard.app"
          /tmp/Smart-Dartboard-macOS-unsigned.zip

      - name: Upload unsigned macOS preview
        uses: actions/upload-artifact@v7
        with:
          name: Smart-Dartboard-macOS-unsigned
          path: /tmp/Smart-Dartboard-macOS-unsigned.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned iOS device archive
        run: npm --prefix apps/tauri run ios:build:device

      - name: Archive unsigned iOS device build
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "apps/tauri/src-tauri/gen/apple/build/sdb-native-m0_iOS.xcarchive"
          /tmp/Smart-Dartboard-iOS-device-unsigned.xcarchive.zip

      - name: Upload unsigned iOS device archive
        uses: actions/upload-artifact@v7
        with:
          name: Smart-Dartboard-iOS-device-unsigned
          path: /tmp/Smart-Dartboard-iOS-device-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned iOS simulator app
        run: npm --prefix apps/tauri run ios:build:sim

      - name: Exercise iOS suspend and resume
        run: npm --prefix apps/tauri run test:ios:lifecycle

  container:
    name: Container build and smoke test
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: smart-dartboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          container_name="smart-dartboard-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --env SDB_ENABLE_BLE=0 \
            --env SDB_ALLOW_TEST_EVENTS=1 \
            --env SDB_DATA_DIR=/tmp/smart-dartboard-ci \
            --publish 127.0.0.1:18080:8000 \
            smart-dartboard:ci

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          python -c 'import json; state=json.load(open("/tmp/health.json")); assert state["status"] == "ok", state'
          curl --fail --silent --show-error http://127.0.0.1:18080/control >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/projector >/dev/null

  rust-container-preview:
    name: Rust container preview
    needs: rust-core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Rust preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rust
          load: true
          push: false
          tags: smart-dartboard:rust-preview-ci
          cache-from: type=gha,scope=rust-preview
          cache-to: type=gha,mode=max,scope=rust-preview

      - name: Build Linux BLE gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ble
          load: true
          push: false
          tags: smart-dartboard:ble-gateway-ci
          cache-from: type=gha,scope=ble-gateway
          cache-to: type=gha,mode=max,scope=ble-gateway

      - name: Smoke-test recovery and container isolation
        shell: bash
        run: |
          set -euo pipefail
          container_name="smart-dartboard-rust-${GITHUB_RUN_ID}"
          volume_name="smart-dartboard-rust-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            docker volume rm "$volume_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume_name" >/dev/null
          docker run --detach \
            --name "$container_name" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "source=$volume_name,target=/data" \
            --publish 127.0.0.1:18081:8000 \
            --env SDB_ENABLE_BLE=1 \
            --env SDB_BOARD_TOKEN=ci-board-secret \
            smart-dartboard:rust-preview-ci

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18081/api/v2/health > /tmp/rust-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container_name"
            exit 1
          fi

          python - <<'PY'
          import json
          health = json.load(open('/tmp/rust-health.json'))
          assert health['status'] == 'degraded', health
          assert health['schema_version'] == 6, health
          assert health['database'] == 'ok', health
          assert health['board'] == 'unavailable', health
          assert health['companion'] == 'disabled', health
          PY
          curl --fail --silent --show-error http://127.0.0.1:18081/control >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18081/projector >/dev/null
          curl --fail --silent --show-error --location http://127.0.0.1:18081/ \
            | grep -F '<title>Smart Dartboard · Control</title>' >/dev/null
          test "$(docker inspect "$container_name" --format '{{.Config.User}}')" = dartboard
          test "$(docker inspect "$container_name" --format '{{.HostConfig.Privileged}}')" = false
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          base = 'http://127.0.0.1:18081'
          bootstrap = json.load(urllib.request.urlopen(base + '/api/v2/runtime/bootstrap'))
          commands = [
              ('session', {
                  'type': 'start_session',
                  'session_id': 'ci-session',
                  'players': [{
                      'id': 'ci-player', 'name': 'CI Player',
                      'avatar': 'target', 'color': '#28e7ff',
                  }],
              }),
              ('prepare', {
                  'type': 'prepare_game', 'game_type': 'x01',
                  'options': {'start_score': 40, 'out_rule': 'double'},
              }),
              ('start', {'type': 'start_prepared_game', 'game_id': 'ci-game'}),
              ('playing', {'type': 'mark_game_playing'}),
              ('theme', {'type': 'update_art_theme', 'theme': 'neon'}),
          ]
          revision = 0
          for command_id, command in commands:
              envelope = {
                  'protocol_version': 1,
                  'command_id': f'ci-{command_id}',
                  'runtime_instance_id': bootstrap['runtime_instance_id'],
                  'expected_revision': revision,
                  'command': command,
              }
              request = urllib.request.Request(
                  base + '/api/v2/runtime/commands',
                  data=json.dumps(envelope).encode(),
                  headers={'content-type': 'application/json'},
              )
              result = json.load(urllib.request.urlopen(request))
              revision = result['revision']
          assert revision == 5, result

          def board_post(path, payload, authenticated=True):
              headers = {'content-type': 'application/json'}
              if authenticated:
                  headers['authorization'] = 'Bearer ci-board-secret'
              request = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload).encode(),
                  headers=headers,
              )
              return json.load(urllib.request.urlopen(request))

          try:
              board_post('/api/v2/board/status', {'phase': 'scanning'}, False)
              raise AssertionError('unauthenticated board status was accepted')
          except urllib.error.HTTPError as error:
              assert error.code == 403, error
          board_post('/api/v2/board/status', {
              'phase': 'ready', 'connection_id': 'ci-link',
          })
          packet = {
              'connection_id': 'ci-link',
              'raw_hex': '0100000005000d00020f',
          }
          result = board_post('/api/v2/board/packets', packet)
          assert result['disposition'] == 'applied', result
          duplicate = board_post('/api/v2/board/packets', packet)
          assert duplicate['disposition'] == 'duplicate', duplicate
          revision = result['result']['revision']
          assert revision == 6, result
          armed = board_post('/api/v2/board/packets', {
              'connection_id': 'ci-link',
              'raw_hex': '0200000000000000ffff',
          })
          assert armed['disposition'] == 'applied', armed
          assert armed['result']['revision'] == 7, armed
          assert armed['result']['session']['screen'] == 'game_result', armed
          assert armed['result']['session']['rematch_armed_until_ms'], armed
          released = board_post('/api/v2/board/packets', {
              'connection_id': 'ci-link',
              'raw_hex': '0300000000000000eeee',
          })
          assert released['disposition'] == 'button', released
          rematch = board_post('/api/v2/board/packets', {
              'connection_id': 'ci-link',
              'raw_hex': '0400000000000000ffff',
          })
          assert rematch['disposition'] == 'applied', rematch
          assert rematch['result']['revision'] == 8, rematch
          assert rematch['result']['session']['screen'] == 'countdown', rematch
          open('/tmp/rust-instance-before', 'w').write(bootstrap['runtime_instance_id'])
          PY
          SECONDS=0
          docker stop --time 5 "$container_name" >/dev/null
          test "$(docker inspect "$container_name" --format '{{.State.ExitCode}}')" = 0
          test "$SECONDS" -lt 5
          docker start "$container_name" >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18081/api/v2/runtime/bootstrap > /tmp/rust-recovered.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          import urllib.request
          recovered = json.load(open('/tmp/rust-recovered.json'))
          previous_instance = open('/tmp/rust-instance-before').read()
          assert recovered['revision'] == 8, recovered
          assert recovered['payload']['game']['game_type'] == 'x01', recovered
          assert recovered['payload']['settings']['art_theme'] == 'neon', recovered
          assert recovered['runtime_instance_id'] != previous_instance, recovered
          detail = json.load(urllib.request.urlopen(
              'http://127.0.0.1:18081/api/v2/history/games/ci-game'
          ))
          replay = json.load(urllib.request.urlopen(
              'http://127.0.0.1:18081/api/v2/history/games/ci-game/replay'
          ))
          statistics = json.load(urllib.request.urlopen(
              'http://127.0.0.1:18081/api/v2/statistics/players'
          ))
          assert detail['game']['status'] == 'finished', detail
          assert detail['throws'][0]['event']['label'] == 'D20', detail
          assert len(replay['events']) == 1, replay
          assert statistics[0]['wins'] == 1, statistics
          PY
