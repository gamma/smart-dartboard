name: Publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "web/static/assets/modes/**"
      - "web/static/assets/themes/neon/modes/**"
      - "ASSETS_LICENSE.md"
      - "LICENSE"
      - "NOTICE"
      - "TRADEMARKS.md"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check website JavaScript
        run: node --check website/app.js

      - name: Build static site
        run: bash website/build.sh

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/app.js
          test "$(find web/static/assets/modes -maxdepth 1 -name '*.webp' | wc -l)" \
            -eq "$(find dist/assets/modes -maxdepth 1 -name '*.webp' | wc -l)"
          test "$(find web/static/assets/themes/neon/modes -maxdepth 1 -name '*.webp' | wc -l)" \
            -eq "$(find dist/assets/neon -maxdepth 1 -name '*.webp' | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
