[workspace]
resolver = "2"
exclude = ["apps/tauri/src-tauri"]
members = [
  "crates/board",
  "crates/companion",
  "crates/companion-transport",
  "crates/contracts",
  "crates/game-core",
  "crates/protocol",
  "crates/runtime",
  "crates/server",
  "crates/session-core",
  "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/gamma/smart-dartboard"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
