[package]
name = "sdb-server"
description = "Headless HTTP and WebSocket host for the Smart Dartboard runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
sdb-board = { version = "0.1.0", path = "../board" }
sdb-companion = { version = "0.1.0", path = "../companion" }
sdb-contracts = { version = "0.1.0", path = "../contracts" }
sdb-diagnostics = { version = "0.1.0", path = "../diagnostics" }
sdb-game-core = { version = "0.1.0", path = "../game-core" }
sdb-runtime = { version = "0.1.0", path = "../runtime" }
sdb-storage = { version = "0.1.0", path = "../storage" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["fs", "set-header"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
