[package]
name = "sdb-native-m0"
description = "Smart Dartboard native feasibility shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[lib]
name = "sdb_native_m0_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sdb-board = { path = "../../../crates/board" }
sdb-companion = { path = "../../../crates/companion" }
sdb-companion-transport = { path = "../../../crates/companion-transport" }
sdb-contracts = { path = "../../../crates/contracts" }
sdb-runtime = { path = "../../../crates/runtime" }
sdb-storage = { path = "../../../crates/storage" }
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1.47", features = ["io-util", "net", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-http = { version = "0.6", features = ["set-header"] }
uuid = { version = "1.24", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

[workspace]

[lints.rust]
unsafe_code = "deny"
