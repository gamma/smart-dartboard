[package]
name = "sdb-native-m0"
description = "Smart Dartboard native feasibility shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[lib]
name = "sdb_native_m0_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sdb-board = { path = "../../../crates/board" }
sdb-companion = { path = "../../../crates/companion" }
sdb-contracts = { path = "../../../crates/contracts" }
sdb-runtime = { path = "../../../crates/runtime" }
sdb-storage = { path = "../../../crates/storage" }
tauri = { version = "2.11.5", features = [] }
uuid = { version = "1.24", features = ["v4"] }

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[workspace]

[lints.rust]
unsafe_code = "deny"
