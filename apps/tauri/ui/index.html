<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>Smart Dartboard · Native M0</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <p class="eyebrow">NATIVE M0 · <span id="role">CONTROL</span></p>
    <div class="mark" aria-hidden="true">◎</div>
    <h1>Eine Runtime.<br>Zwei Screens.</h1>
    <p class="subtitle">Der gemeinsame Rust-Zustand läuft lokal und wird an alle Views verteilt.</p>
    <output id="counter">0</output>
    <button id="increment" type="button">Testtreffer senden</button>
    <p id="status" class="status">Runtime wird verbunden …</p>
  </main>
  <script src="./main.js"></script>
</body>
</html>
