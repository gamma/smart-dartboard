<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dartboard Control</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="page"><div class="row"><h1>Smart Dartboard Control</h1><div id="wsStatus"></div><a href="/projector" target="_blank">Projector öffnen</a></div><div class="card"><h2>Neues Spiel</h2><div class="row"><select id="gameType"><option value="countup">Count Up</option><option value="x01">X01</option></select><input id="x01" type="number" value="501" min="101" step="100"><button onclick="newGame()">Start</button><button class="secondary" onclick="nextPlayer()">Nächster Spieler</button></div><p>Spieler, eine Zeile pro Name:</p><textarea id="names" style="width:100%;height:90px;border-radius:12px;background:#222;color:#fff;border:1px solid #555;padding:10px">Player 1
Player 2</textarea></div><div class="card"><h2>Spielstand</h2><div id="meta"></div><div id="players" class="players"></div></div><div class="card"><h2>Test ohne Board</h2><div class="row"><button onclick="inject('hit','S20',20)">S20</button><button onclick="inject('hit','T20',60)">T20</button><button onclick="inject('miss','MISS',0)">Miss</button></div></div><div class="card"><h2>Letztes Event</h2><div id="last" class="history"></div></div></div><script src="/static/app.js"></script></body></html>
