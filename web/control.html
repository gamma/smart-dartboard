<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>Smart Dartboard · Control</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/effects.css">
  <link rel="stylesheet" href="/static/interaction.css">
  <link rel="stylesheet" href="/static/analytics.css">
</head>
<body class="control-body">
  <div class="control-app">
    <header class="topbar">
      <button class="brand-button" data-action="home" aria-label="Startseite">
        <span class="brand-mark">◎</span>
        <span><b>SMART DARTS</b><small id="brandSubtitle">SESSION-STEUERUNG</small></span>
      </button>
      <div class="topbar-actions">
        <span id="wsStatus" class="connection-pill"></span>
        <a class="icon-button" href="/projector" target="_blank" title="Projektor öffnen">↗</a>
        <button class="icon-button settings-button" data-action="open-settings" title="Einstellungen" aria-label="Einstellungen" aria-pressed="false">⚙</button>
        <div class="topbar-language" aria-label="UI language">
          <button data-action="set-ui-language" data-language="de" aria-label="Deutsch" title="Deutsch"><span aria-hidden="true">🇩🇪</span></button>
          <button data-action="set-ui-language" data-language="en" aria-label="English" title="English"><span aria-hidden="true">🇬🇧</span></button>
        </div>
      </div>
    </header>
    <main id="controlRoot" class="control-root" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
