<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>Smart Dartboard · Control</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/interaction.css">
</head>
<body class="control-body">
  <div class="control-app">
    <header class="topbar">
      <button class="brand-button" data-action="home" aria-label="Startseite">
        <span class="brand-mark">◎</span>
        <span><b>SMART DARTS</b><small>SESSION CONTROL</small></span>
      </button>
      <div class="topbar-actions">
        <span id="wsStatus" class="connection-pill"></span>
        <a class="icon-button" href="/projector" target="_blank" title="Projektor öffnen">↗</a>
      </div>
    </header>
    <main id="controlRoot" class="control-root" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
